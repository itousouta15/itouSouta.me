name: lighthouse

on:
  workflow_dispatch:
  schedule:
    # 每週日 22:00 UTC（週一 06:00 台北）
    - cron: "0 22 * * 0"

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # 報表上傳 temporary-public-storage（免 token）；要 GitHub Checks
      # 顯示再加 LHCI_GITHUB_APP_TOKEN
      - run: npx lhci autorun --config=.lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
